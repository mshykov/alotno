<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self';" />
  <title>Alotno</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>Alotno</h1>
      <p class="subtitle">PNG → WebP, SVG (vector trace), EPS</p>
    </header>

    <section id="drop" class="dropzone">
      <div class="dz-inner">
        <div class="dz-icon">⇩</div>
        <div>Drop PNG files here</div>
        <button id="browse" class="link">or click to browse</button>
      </div>
    </section>

    <section class="options">
      <div class="row">
        <label><strong>Output formats</strong></label>
        <div class="inline">
          <label><input type="checkbox" id="fmt-webp" checked /> WebP</label>
          <label><input type="checkbox" id="fmt-svg" checked /> SVG</label>
          <label><input type="checkbox" id="fmt-eps" /> EPS</label>
        </div>
      </div>

      <div class="row">
        <label for="quality"><strong>WebP quality</strong> <span id="qval">82</span></label>
        <input type="range" id="quality" min="0" max="100" value="82" />
        <label class="muted"><input type="checkbox" id="lossless" /> Lossless</label>
      </div>

      <div class="row">
        <label><strong>Output folder</strong></label>
        <div class="inline">
          <span id="outdir" class="path muted">Same as source file</span>
          <button id="pick-out">Choose…</button>
          <button id="clear-out" class="link">reset</button>
        </div>
      </div>
    </section>

    <details class="advanced" open>
      <summary><strong>Vector (SVG / EPS) settings</strong></summary>

      <div class="row">
        <label><strong>Quality preset</strong></label>
        <div class="inline">
          <select id="preset">
            <option value="low">Low (fastest, fewer details)</option>
            <option value="medium">Medium</option>
            <option value="high" selected>High</option>
            <option value="ultra">Ultra (slowest, most detail)</option>
          </select>
        </div>
      </div>

      <div class="row">
        <label><strong>Color mode</strong></label>
        <div class="inline">
          <select id="color-mode">
            <option value="mono" selected>Monochrome (B/W trace)</option>
            <option value="posterized">Posterized (multi-color)</option>
          </select>
          <label class="muted">Steps <input type="number" id="poster-steps" min="2" max="8" value="4" style="width:54px"/></label>
        </div>
      </div>

      <div class="row">
        <label for="threshold"><strong>Threshold</strong> <span id="thval">128</span></label>
        <input type="range" id="threshold" min="0" max="255" value="128" />
        <span class="muted">B/W cutoff (mono mode)</span>
      </div>

      <div class="row">
        <label for="tolerance"><strong>Line fit tolerance</strong> <span id="tolval">preset</span></label>
        <input type="range" id="tolerance" min="0" max="200" value="0" />
        <span class="muted">0 = use preset</span>
      </div>

      <div class="row">
        <label><strong>Draw style</strong></label>
        <div class="inline">
          <select id="fill-stroke">
            <option value="fill" selected>Fill</option>
            <option value="stroke">Stroke only</option>
            <option value="both">Fill + Stroke</option>
          </select>
          <label class="muted">Color <input type="color" id="stroke-color" value="#000000"/></label>
          <label class="muted">Width <input type="number" id="stroke-width" min="0.1" max="20" step="0.1" value="1" style="width:60px"/></label>
          <label class="muted"><input type="checkbox" id="non-scaling"/> Non-scaling stroke</label>
        </div>
      </div>

      <div class="row">
        <label><strong>Curve types</strong></label>
        <div class="inline">
          <select id="curve-type">
            <option value="curves" selected>Curves (Bézier)</option>
            <option value="lines">Lines only (polygon)</option>
          </select>
        </div>
      </div>

      <div class="row">
        <label><strong>Shape stacking</strong></label>
        <div class="inline">
          <select id="stacking">
            <option value="cutouts" selected>Cutouts (spread)</option>
            <option value="stacked">Stacked (dominant)</option>
          </select>
          <span class="muted">posterized mode</span>
        </div>
      </div>

      <div class="row">
        <label><strong>SVG version</strong></label>
        <div class="inline">
          <select id="svg-version">
            <option value="1.1" selected>SVG 1.1</option>
            <option value="1.0">SVG 1.0</option>
          </select>
        </div>
      </div>
    </details>

    <section class="files">
      <div class="files-head">
        <strong>Files <span id="count">(0)</span></strong>
        <button id="clear" class="link">clear</button>
      </div>
      <ul id="list"></ul>
    </section>

    <footer>
      <button id="convert" class="primary" disabled>Convert</button>
      <button id="reveal" disabled>Reveal in Finder</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
