name: Build WASM core
description: >
  Set up Rust + wasm-pack and build the Alotno WASM bundle into
  bindings/wasm/pkg. Assumes the repo is already checked out. Shared by the CI
  and deploy workflows so they build the WASM identically (no drift).

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        toolchain: stable # required when SHA-pinned (channel can't come from the ref)
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
    # Prebuilt wasm-pack binary — replaces the previous `curl | sh` install
    # (no piping a remote script into a shell).
    - uses: taiki-e/install-action@0631aa6515c7d545823c67cfae7ef4fc7f490154 # v2
      with:
        tool: wasm-pack
    - shell: bash
      run: wasm-pack build bindings/wasm --target web --out-dir pkg --release
