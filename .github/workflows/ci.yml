name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---- Rust: the core engine + both bindings (format, lint, test) ----
  rust:
    # Name kept exactly as the branch-protection required-check context on `main`.
    name: Rust core (test + wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable # required when SHA-pinned (channel can't come from the ref)
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test (incl. parser fuzz/proptests)
        run: cargo test --workspace --all-features
      # Fail on any new RUSTSEC vulnerability or unmaintained crate in the
      # workspace lockfile. Accepted transitive advisories are documented in
      # deny.toml.
      - name: Install cargo-deny
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          # Pin the exact tool version so advisory results don't drift with
          # upstream cargo-deny releases.
          tool: cargo-deny@0.19.9
      - name: Advisory scan (RUSTSEC)
        # Both Cargo workspaces: the root (engine + bindings) and the standalone
        # Flutter FFI crate, which has its own lockfile the root scan can't see.
        run: |
          cargo deny check advisories
          cargo deny --manifest-path apps/app/rust/Cargo.toml check advisories
      - name: Native FFI crate (apps/app/rust) builds + tests
        # Separate Cargo workspace (cargokit builds it per target). Not linted
        # with -D warnings here because it includes frb-generated code.
        run: cargo test --manifest-path apps/app/rust/Cargo.toml

  # ---- WASM bundle: build once, share with the web job ----
  wasm:
    name: WASM bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/build-wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-pkg
          path: bindings/wasm/pkg

  # ---- Flutter app: static analysis + tests (the shipped desktop product) ----
  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - name: Pub get
        # --enforce-lockfile: resolve exactly what pubspec.lock pins (S8550).
        run: flutter pub get --enforce-lockfile
        working-directory: apps/app
      - name: Analyze
        run: flutter analyze
        working-directory: apps/app
      - name: Test
        # Unit tests for the conversion service + widget tests for the extracted
        # parts. The full ConverterScreen isn't headless-testable (MacosWindow
        # needs a native window), so we test the leaf widgets instead.
        run: flutter test
        working-directory: apps/app

  # ---- Change detection: lets the slow native build skip docs-only changes ----
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A PR run checks out the merge commit, whose first parent is the base
          # branch; a push to main checks out the squash/merge commit. Either
          # way HEAD^1..HEAD is the whole change set, so two commits suffice.
          fetch-depth: 2
      - id: filter
        # Markdown anywhere (docs/ holds only .md) never reaches the native
        # build. Anything else — or a diff we can't compute — runs it.
        # --no-renames lists both sides, so Foo.swift -> Foo.md still builds.
        run: |
          if ! changed=$(git diff --name-only --no-renames HEAD^1 HEAD); then
            echo "::warning::Could not diff against HEAD^1; running the native build."
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qvE '\.md$'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Markdown-only change; skipping the native macOS + iOS build."
          fi

  # ---- Native app build: compile the macOS + iOS shells ----
  # `flutter analyze`/`test` never compile the native app, so Swift/Podfile/
  # plugin-integration breakage (e.g. a missing `override`, a deployment-target
  # bump) would ship undetected. This job is the app-layer regression gate.
  # Android stays out until the SDK/NDK toolchain is wired (see docs/roadmap.md).
  native-build:
    name: Native app build (macOS + iOS sim)
    # Not a required check, so a skip never blocks a merge.
    needs: [changes]
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # cargokit invokes cargo during the Flutter build; ensure a toolchain.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/app/rust
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get --enforce-lockfile
        working-directory: apps/app
      - name: Build macOS (debug)
        run: flutter build macos --debug
        working-directory: apps/app
      - name: Build iOS (simulator, debug, unsigned)
        run: flutter build ios --simulator --debug
        working-directory: apps/app

  # ---- SonarCloud: CI-based scan (Automatic Analysis is off) ----
  # Respects sonar-project.properties (exclusions, project key) — which the
  # automatic mode ignored. Decorates PRs; not a required merge check.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    # Secrets aren't available to fork PRs; skip there rather than fail.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history — Sonar needs it for blame / new-code detection.
          fetch-depth: 0
      # Sonar's Dart analyzer needs resolved packages (package_config), else
      # every Flutter symbol is "undefined" and it emits ~1200 false S2260s.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - name: Resolve Dart packages for the scanner
        run: flutter pub get --enforce-lockfile
        working-directory: apps/app
      # ---- coverage reports fed to the scan ----
      - name: Dart coverage (lcov)
        # lcov SF: paths are relative to apps/app — rewrite to repo-relative so
        # they match the scanner's file keys.
        run: |
          flutter test --coverage
          sed -i 's|^SF:|SF:apps/app/|' coverage/lcov.info
        working-directory: apps/app
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov
      - name: Rust coverage (lcov)
        run: cargo llvm-cov --workspace --all-features --lcov --output-path rust-lcov.info
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---- Web: tokens + type-check + build (consumes the WASM bundle) ----
  web:
    # Name kept exactly as the branch-protection required-check context on `main`.
    name: Web (tokens + Astro build)
    needs: [wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download WASM bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wasm-pkg
          path: bindings/wasm/pkg
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Astro 7 requires Node >= 22.12 (unchanged from 6).
          node-version: 22
          cache: pnpm
      # --ignore-scripts: no lifecycle scripts from deps (S6505). pnpm 10 already
      # blocks unapproved build scripts, so this is explicit, not a behavior change.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate design tokens
        run: pnpm --filter @alotno/design build
      - name: Verify committed Flutter tokens are in sync with the generator
        run: |
          if ! diff -q design/dist/tokens.dart apps/app/lib/design/tokens.dart >/dev/null; then
            echo "::error::apps/app/lib/design/tokens.dart is out of sync with design/tokens.json."
            echo "Run 'pnpm tokens' and copy design/dist/tokens.dart into apps/app/lib/design/."
            diff design/dist/tokens.dart apps/app/lib/design/tokens.dart || true
            exit 1
          fi
      - name: Unit tests (token lib + conversion-dispatch core)
        run: |
          pnpm --filter @alotno/design test
          pnpm --filter @alotno/web test
      - name: Type-check (astro check)
        run: pnpm --filter @alotno/web check
      - name: Build site
        run: pnpm --filter @alotno/web build
