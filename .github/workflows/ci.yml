name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Rust core (test + wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test core
        run: cargo test -p alotno-core
      - name: Check FFI binding builds
        run: cargo check -p alotno-ffi
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM bundle
        run: wasm-pack build bindings/wasm --target web --out-dir pkg --release
      - name: Upload WASM bundle
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: bindings/wasm/pkg

  web:
    name: Web (tokens + Astro build)
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download WASM bundle
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: bindings/wasm/pkg
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate design tokens
        run: pnpm --filter @alotno/design build
      - name: Build site
        run: pnpm --filter @alotno/web build
