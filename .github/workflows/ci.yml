name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---- Rust: the core engine + both bindings (format, lint, test) ----
  rust:
    # Name kept exactly as the branch-protection required-check context on `main`.
    name: Rust core (test + wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable # required when SHA-pinned (channel can't come from the ref)
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test (incl. parser fuzz/proptests)
        run: cargo test --workspace --all-features
      - name: Native FFI crate (apps/app/rust) builds + tests
        # Separate Cargo workspace (cargokit builds it per target). Not linted
        # with -D warnings here because it includes frb-generated code.
        run: cargo test --manifest-path apps/app/rust/Cargo.toml

  # ---- WASM bundle: build once, share with the web job ----
  wasm:
    name: WASM bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/build-wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-pkg
          path: bindings/wasm/pkg

  # ---- Flutter app: static analysis + tests (the shipped desktop product) ----
  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
        working-directory: apps/app
      - name: Analyze
        run: flutter analyze
        working-directory: apps/app
      - name: Test
        # Unit tests for the conversion service + widget tests for the extracted
        # parts. The full ConverterScreen isn't headless-testable (MacosWindow
        # needs a native window), so we test the leaf widgets instead.
        run: flutter test
        working-directory: apps/app

  # ---- SonarCloud: CI-based scan (Automatic Analysis is off) ----
  # Respects sonar-project.properties (exclusions, project key) — which the
  # automatic mode ignored. Decorates PRs; not a required merge check.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    # Secrets aren't available to fork PRs; skip there rather than fail.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history — Sonar needs it for blame / new-code detection.
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---- Web: tokens + type-check + build (consumes the WASM bundle) ----
  web:
    # Name kept exactly as the branch-protection required-check context on `main`.
    name: Web (tokens + Astro build)
    needs: [wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download WASM bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wasm-pkg
          path: bindings/wasm/pkg
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate design tokens
        run: pnpm --filter @alotno/design build
      - name: Verify committed Flutter tokens are in sync with the generator
        run: |
          if ! diff -q design/dist/tokens.dart apps/app/lib/design/tokens.dart >/dev/null; then
            echo "::error::apps/app/lib/design/tokens.dart is out of sync with design/tokens.json."
            echo "Run 'pnpm tokens' and copy design/dist/tokens.dart into apps/app/lib/design/."
            diff design/dist/tokens.dart apps/app/lib/design/tokens.dart || true
            exit 1
          fi
      - name: Type-check (astro check)
        run: pnpm --filter @alotno/web check
      - name: Build site
        run: pnpm --filter @alotno/web build
