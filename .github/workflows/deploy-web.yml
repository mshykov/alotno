name: Deploy web

# Auto-deploys apps/web to Cloudflare Pages on every push to main that touches
# the web app or anything it's built from. Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN   — token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account ID
# (See docs/deploying-web.md.)

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "core/**"
      - "bindings/wasm/**"
      - "design/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build + deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Same composite action CI uses — keeps the WASM build identical.
      - name: Build WASM core
        uses: ./.github/actions/build-wasm
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      # --ignore-scripts mirrors ci.yml (S6505); pnpm 10 blocks them anyway.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate design tokens
        run: pnpm --filter @alotno/design build
      - name: Build site
        run: pnpm --filter @alotno/web build
      - name: Deploy to Cloudflare Pages
        # Run wrangler via npx (not cloudflare/wrangler-action, which does
        # `pnpm add wrangler` and fails at a pnpm workspace root).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy apps/web/dist --project-name=alotno --branch=main
