# SonarCloud analysis config — used by the CI-based scan (Automatic Analysis is
# off; it ignored this file, which is why platform scaffolding was flooding the
# issue list).
sonar.projectKey=mshykov_alotno
sonar.organization=mshykov

# Exclude the retired Electron prototype, generated code, platform scaffolding,
# and build artifacts — only first-party source should be scanned/gated.
sonar.exclusions=\
  legacy/**,\
  **/dist/**,\
  **/build/**,\
  bindings/wasm/pkg/**,\
  design/dist/**,\
  apps/app/lib/src/rust/**,\
  apps/app/lib/design/tokens.dart,\
  apps/app/rust/src/frb_generated.rs,\
  apps/app/rust_builder/**,\
  apps/app/macos/**,\
  apps/app/ios/**,\
  apps/app/android/**,\
  apps/app/windows/**,\
  apps/app/linux/**

# Classify test code as tests — otherwise the test files themselves count as
# uncovered "code to cover" (they did: 114 phantom lines).
sonar.test.inclusions=apps/app/test/**,core/tests/**

# Coverage: CI generates lcov for Dart (flutter test --coverage, rewritten to
# repo-relative paths) and Rust (cargo llvm-cov --workspace).
sonar.dart.lcov.reportPaths=apps/app/coverage/lcov.info
sonar.rust.lcov.reportPaths=rust-lcov.info

# Surfaces with no test runner wired (web/scripts/generator) or that only run
# inside a real platform process (bindings, the FFI crate, the app entrypoint,
# and converter_screen — its MacosWindow needs a real native window; proven to
# crash headless) are excluded from coverage — measured code reflects what
# tests can actually reach.
sonar.coverage.exclusions=\
  apps/web/**,\
  design/**,\
  scripts/**,\
  bindings/**,\
  apps/app/rust/**,\
  apps/app/lib/main.dart,\
  apps/app/lib/converter_screen.dart

# Accepted: S6505 flags `npx wrangler` in the deploy step. Wrangler IS the
# deployment tool — executing it is the point, and --ignore-scripts would break
# its workerd install. The pnpm installs in CI/deploy DO use --ignore-scripts.
sonar.issue.ignore.multicriteria=w1,w2
sonar.issue.ignore.multicriteria.w1.ruleKey=shell:S6505
sonar.issue.ignore.multicriteria.w1.resourceKey=scripts/deploy-web.sh
sonar.issue.ignore.multicriteria.w2.ruleKey=githubactions:S6505
sonar.issue.ignore.multicriteria.w2.resourceKey=.github/workflows/deploy-web.yml
